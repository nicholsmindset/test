<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe7ff" />
    <title>Wellbeing — Health Tracker MVP</title>
    <style>
:root {
  --bg-grad-1: #f3e7ff;
  --bg-grad-2: #ffe1eb;
  --bg-grad-3: #e7f0ff;
  --phone-bg-1: #fbf6ff;
  --phone-bg-2: #f3e8ff;
  --phone-bg-3: #ffeaf3;
  --ink: #2a2350;
  --ink-soft: #6a6191;
  --muted: #9b94be;
  --accent: #8b5cf6;
  --accent-2: #c084fc;
  --pink: #f472b6;
  --blue: #7aa7ff;
  --orange: #ffb480;
  --card: #ffffff;
  --card-shadow: 0 6px 18px rgba(123, 90, 191, 0.08);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    sans-serif;
  color: var(--ink);
  background: radial-gradient(
      1200px 600px at 10% 0%,
      var(--bg-grad-1),
      transparent 60%
    ),
    radial-gradient(900px 600px at 100% 20%, var(--bg-grad-2), transparent 60%),
    radial-gradient(900px 600px at 50% 100%, var(--bg-grad-3), transparent 70%),
    #fafaff;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.stage {
  display: flex;
  gap: 32px;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
  padding: 48px 24px 24px;
  min-height: calc(100vh - 60px);
}

.page-footer {
  text-align: center;
  color: var(--muted);
  padding: 20px 12px 36px;
}

/* ───── Phone frame ───── */
.phone {
  width: 320px;
  height: 660px;
  border-radius: 44px;
  padding: 8px;
  background: linear-gradient(180deg, #ffffff, #f1eaff);
  box-shadow: 0 30px 60px rgba(120, 90, 200, 0.18),
    0 0 0 1px rgba(255, 255, 255, 0.6) inset;
  position: relative;
  overflow: hidden;
}

.phone::before {
  content: "";
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 22px;
  background: #0e0a1f;
  border-radius: 14px;
  z-index: 5;
  opacity: 0.92;
}

.screen {
  width: 100%;
  height: 100%;
  border-radius: 38px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 18px 18px 90px;
  position: relative;
  scrollbar-width: thin;
}

.screen::-webkit-scrollbar { width: 4px; }
.screen::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.25); border-radius: 4px; }

.screen.splash {
  background: linear-gradient(180deg, var(--phone-bg-1), #f7e9ff 60%, #ffeaf3);
  display: flex;
  flex-direction: column;
}
.screen.home {
  background: linear-gradient(180deg, var(--phone-bg-2), #ffe6f0 90%);
}
.screen.report {
  background: linear-gradient(180deg, #efe7ff, #ffe6f0 90%);
}

/* ───── Status bar ───── */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 14px;
  padding: 6px 14px 4px;
  color: var(--ink);
}
.status-icons {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}
.bars,
.wifi,
.battery {
  display: inline-block;
  background: var(--ink);
  border-radius: 2px;
}
.bars { width: 16px; height: 10px; clip-path: polygon(0 100%, 25% 100%, 25% 65%, 50% 65%, 50% 35%, 75% 35%, 75% 0, 100% 0, 100% 100%); }
.wifi { width: 14px; height: 10px; clip-path: polygon(50% 0,100% 50%,75% 75%,50% 50%,25% 75%,0 50%); }
.battery { width: 22px; height: 10px; border-radius: 3px; position: relative; }
.battery::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:4px; background: var(--ink); border-radius: 1px; }

/* ───── Splash ───── */
.splash-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 24px 60px;
  text-align: center;
}
.logo {
  width: 140px;
  height: 130px;
  filter: drop-shadow(0 8px 20px rgba(167, 139, 250, 0.35));
  animation: float 3.5s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.brand {
  font-size: 28px;
  margin: 22px 0 4px;
  background: linear-gradient(90deg, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -0.02em;
}
.tagline {
  color: var(--ink-soft);
  margin: 0 0 32px;
  font-size: 14px;
}

/* ───── CTA button ───── */
.cta {
  appearance: none;
  border: none;
  background: linear-gradient(90deg, #a78bfa, #c084fc);
  color: white;
  font-weight: 600;
  font-size: 15px;
  padding: 14px 36px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(139, 92, 246, 0.35);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.cta:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(139, 92, 246, 0.45); }
.cta:active { transform: translateY(0); }

.cta.next {
  display: block;
  width: calc(100% - 36px);
  margin: 18px auto 8px;
  padding: 14px 0;
  position: sticky;
  bottom: 14px;
}

/* ───── Home header ───── */
.home-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 6px 14px;
}
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(123, 90, 191, 0.15);
}
.avatar svg { width: 100%; height: 100%; display: block; }
.hello { flex: 1; line-height: 1.25; }
.hi { font-weight: 700; font-size: 15px; }
.sub { color: var(--ink-soft); font-size: 12px; }
.bell, .profile {
  position: relative;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.7);
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 8px rgba(123, 90, 191, 0.12);
}
.bell .dot {
  position: absolute;
  top: 8px; right: 9px;
  width: 8px; height: 8px;
  background: var(--pink);
  border-radius: 50%;
  border: 2px solid white;
}

.section-row {
  display: flex; justify-content: space-between; align-items: center;
  margin: 14px 4px 10px;
}
.section-row h2 {
  font-size: 14px;
  margin: 0;
  letter-spacing: -0.01em;
}
.link {
  border: none; background: none; color: var(--accent);
  font-size: 12px; font-weight: 600; cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ───── Activity card ───── */
.act {
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 12px;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.act:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(123, 90, 191, 0.14); }
.act .icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: #eef0ff;
}
.act .icon svg { width: 22px; height: 22px; }
.act.t-walk .icon { background: #e6efff; color: #5680ea; }
.act.t-lunch .icon { background: #fff2e0; color: #f08a3a; }
.act.t-pushup .icon { background: #efe6ff; color: #8b5cf6; }
.act.t-temp .icon { background: #ffe7ee; color: #ef4475; }
.act .time { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.act .label { color: var(--ink-soft); font-size: 12px; }
.act.t-walk .time { color: #5680ea; }
.act.t-lunch .time { color: #f08a3a; }
.act.t-pushup .time { color: #8b5cf6; }
.act.t-temp .time { color: #ef4475; }

/* ───── Suggestions ───── */
.suggestions {
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.sug {
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 10px;
  box-shadow: var(--card-shadow);
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.sug:hover { transform: translateY(-2px); }
.sug .ill {
  height: 44px; display: grid; place-items: center;
}
.sug .ill svg { width: 38px; height: 38px; }
.sug .title { font-weight: 700; font-size: 11px; margin: 6px 0 2px; }
.sug .desc { color: var(--ink-soft); font-size: 10px; line-height: 1.3; }

/* ───── Tab bar ───── */
.tabbar {
  position: absolute;
  bottom: 14px;
  left: 14px;
  right: 14px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(14px);
  border-radius: 999px;
  display: flex;
  justify-content: space-around;
  padding: 8px;
  box-shadow: 0 8px 22px rgba(123, 90, 191, 0.18);
  z-index: 4;
}
.tab {
  border: none;
  background: transparent;
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--muted);
  transition: background 0.2s ease, color 0.2s ease;
}
.tab svg { width: 22px; height: 22px; }
.tab.active {
  background: linear-gradient(135deg, #a78bfa, #67e8f9);
  color: white;
  box-shadow: 0 6px 14px rgba(139, 92, 246, 0.4);
}

/* ───── Report ───── */
.report-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 4px 14px;
}
.report-header h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
.header-actions { display: flex; gap: 8px; }

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  background: rgba(255,255,255,0.6);
  border-radius: 999px;
  padding: 4px;
  margin-bottom: 22px;
}
.seg {
  border: none;
  background: transparent;
  padding: 9px 0;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s ease;
}
.seg.active {
  background: linear-gradient(90deg, #a78bfa, #c084fc);
  color: white;
  box-shadow: 0 6px 14px rgba(139, 92, 246, 0.35);
}

.status-block {
  text-align: center;
  margin-bottom: 6px;
}
.status-title {
  font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em;
}
.status-sub { color: var(--ink-soft); font-size: 13px; margin: 0; }

.visual {
  display: grid;
  grid-template-columns: 1fr 28px;
  gap: 12px;
  align-items: center;
  padding: 12px 4px 10px;
  margin-bottom: 8px;
}
.stomach { width: 100%; height: 220px; }

/* ───── Slider ───── */
.slider-wrap {
  position: relative;
  height: 220px;
  width: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slider-track {
  position: absolute;
  top: 0; bottom: 0;
  width: 4px;
  background: rgba(167, 139, 250, 0.25);
  border-radius: 4px;
  overflow: hidden;
}
.slider-fill {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 20%;
  background: linear-gradient(180deg, #a78bfa, #c084fc);
  border-radius: 4px;
  transition: height 0.15s ease;
}
.slider-tick {
  position: absolute;
  left: -3px;
  width: 10px; height: 2px;
  background: rgba(122, 108, 173, 0.4);
}
#feelSlider {
  position: absolute;
  appearance: none;
  -webkit-appearance: none;
  width: 220px;
  height: 28px;
  background: transparent;
  transform: rotate(90deg);
  cursor: pointer;
  margin: 0;
}
#feelSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a78bfa, #c084fc);
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.5);
  border: 3px solid white;
  cursor: grab;
}
#feelSlider::-moz-range-thumb {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a78bfa, #c084fc);
  border: 3px solid white;
  cursor: grab;
}

/* ───── Toast ───── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(40, 24, 78, 0.92);
  color: white;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 999;
  box-shadow: 0 14px 30px rgba(40, 24, 78, 0.3);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ───── Mobile single-screen view ───── */
@media (max-width: 1024px) {
  .stage { gap: 18px; padding: 24px 12px; }
}
@media (max-width: 720px) {
  .stage {
    flex-wrap: nowrap;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 20px 12px;
    gap: 14px;
  }
  .phone {
    flex: 0 0 88vw;
    max-width: 360px;
    height: 78vh;
    scroll-snap-align: center;
  }
}

</style>
  </head>
  <body>
    <main class="stage" id="stage">
      <!-- Splash -->
      <section class="phone" data-screen="splash" aria-label="Splash screen">
        <div class="screen splash">
          <div class="status-bar">
            <span>9:41</span>
            <span class="status-icons">
              <span class="bars"></span>
              <span class="wifi"></span>
              <span class="battery"></span>
            </span>
          </div>
          <div class="splash-body">
            <svg class="logo" viewBox="0 0 200 180" aria-hidden="true">
              <defs>
                <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#a78bfa" />
                  <stop offset="100%" stop-color="#f472b6" />
                </linearGradient>
              </defs>
              <path
                d="M100 160 C30 110 20 60 55 35 C80 18 100 40 100 55 C100 40 120 18 145 35 C180 60 170 110 100 160 Z"
                fill="none"
                stroke="url(#g1)"
                stroke-width="8"
                stroke-linejoin="round"
              />
              <path
                d="M70 78 h20 l8 -14 l10 28 l9 -18 h23"
                fill="none"
                stroke="url(#g1)"
                stroke-width="6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <h1 class="brand">Wellbeing</h1>
            <p class="tagline">Track how you feel, every day.</p>
            <button class="cta" id="enterApp">Get started</button>
          </div>
        </div>
      </section>

      <!-- Home -->
      <section class="phone" data-screen="home" aria-label="Home screen">
        <div class="screen home">
          <div class="status-bar">
            <span>9:41</span>
            <span class="status-icons">
              <span class="bars"></span>
              <span class="wifi"></span>
              <span class="battery"></span>
            </span>
          </div>

          <header class="home-header">
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="20" fill="#e9defc" />
                <circle cx="20" cy="16" r="7" fill="#b794f4" />
                <path d="M6 36 C10 26 30 26 34 36 Z" fill="#b794f4" />
              </svg>
            </div>
            <div class="hello">
              <div class="hi">
                Hello Jhon <span class="wave" aria-hidden="true">👋</span>
              </div>
              <div class="sub">How are you feeling today?</div>
            </div>
            <button class="bell" aria-label="Notifications">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path
                  d="M12 3a6 6 0 0 0-6 6v3l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0"
                  fill="none"
                  stroke="#5b3aa3"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="dot"></span>
            </button>
          </header>

          <div class="section-row">
            <h2>Today's activity log</h2>
            <button class="link" id="seeAll">See all</button>
          </div>

          <div class="grid activities" id="activities"></div>

          <div class="section-row">
            <h2>Today's suggestions for you</h2>
          </div>

          <div class="grid suggestions" id="suggestions"></div>

          <nav class="tabbar" aria-label="Bottom navigation">
            <button class="tab active" data-tab="home" aria-label="Home">
              <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2z" fill="currentColor"/></svg>
            </button>
            <button class="tab" data-tab="history" aria-label="History">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="tab" data-tab="checkin" aria-label="Check in">
              <svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="tab" data-tab="report" aria-label="Health report">
              <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </nav>
        </div>
      </section>

      <!-- Report -->
      <section class="phone" data-screen="report" aria-label="Health report screen">
        <div class="screen report">
          <div class="status-bar">
            <span>9:41</span>
            <span class="status-icons">
              <span class="bars"></span>
              <span class="wifi"></span>
              <span class="battery"></span>
            </span>
          </div>

          <header class="report-header">
            <h1>Health report</h1>
            <div class="header-actions">
              <button class="bell" aria-label="Notifications">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <path d="M12 3a6 6 0 0 0-6 6v3l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0"
                    fill="none" stroke="#5b3aa3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button class="profile" aria-label="Profile">
                <svg viewBox="0 0 24 24" width="22" height="22">
                  <circle cx="12" cy="8" r="4" fill="none" stroke="#5b3aa3" stroke-width="1.6"/>
                  <path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" fill="none" stroke="#5b3aa3" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </header>

          <div class="segmented" role="tablist">
            <button class="seg active" role="tab" data-range="weekly">Weekly</button>
            <button class="seg" role="tab" data-range="monthly">Monthly</button>
            <button class="seg" role="tab" data-range="yearly">Yearly</button>
          </div>

          <div class="status-block">
            <h2 class="status-title" id="statusTitle">Satisfied</h2>
            <p class="status-sub" id="statusSub">Feel comfortable</p>
          </div>

          <div class="visual">
            <svg class="stomach" viewBox="0 0 260 240" aria-hidden="true">
              <!-- esophagus -->
              <path d="M150 18 L150 60" stroke="#7aa7ff" stroke-width="3" fill="none" stroke-linecap="round"/>
              <!-- stomach body: classic J-curve sac -->
              <path
                d="M150 60
                   C 150 56, 158 56, 162 60
                   C 192 64, 214 84, 214 118
                   C 214 158, 188 188, 148 192
                   C 116 195, 92 178, 86 150
                   C 84 138, 88 128, 96 124
                   C 100 122, 102 118, 100 112
                   C 96 100, 102 84, 116 76
                   C 128 70, 140 70, 150 76
                   Z"
                fill="#e1ecff"
                stroke="#7aa7ff"
                stroke-width="2.6"
                stroke-linejoin="round"
              />
              <!-- duodenum hook -->
              <path d="M214 130 C 226 132, 232 144, 226 156 C 222 164, 214 166, 208 162"
                    fill="none" stroke="#7aa7ff" stroke-width="2.6" stroke-linecap="round"/>
              <!-- labels + leaders -->
              <text x="186" y="14" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7a6cad">Satisfied</text>
              <line x1="184" y1="11" x2="156" y2="22" stroke="#7a6cad" stroke-width="1" stroke-dasharray="2 3"/>
              <text x="14" y="106" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7a6cad">Very full</text>
              <line x1="60" y1="103" x2="92" y2="118" stroke="#7a6cad" stroke-width="1" stroke-dasharray="2 3"/>
              <text x="20" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7a6cad">Hungry</text>
              <line x1="62" y1="168" x2="92" y2="172" stroke="#7a6cad" stroke-width="1" stroke-dasharray="2 3"/>
            </svg>

            <div class="slider-wrap" aria-label="How are you feeling?">
              <div class="slider-track">
                <div class="slider-fill" id="sliderFill"></div>
                <div class="slider-tick" style="top:8%"></div>
                <div class="slider-tick" style="top:50%"></div>
                <div class="slider-tick" style="top:92%"></div>
              </div>
              <input
                type="range"
                id="feelSlider"
                min="0"
                max="100"
                value="20"
                step="1"
                aria-label="Feeling level"
              />
              <div class="slider-thumb" id="sliderThumb" aria-hidden="true"></div>
            </div>
          </div>

          <button class="cta next" id="nextBtn">Next</button>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <small>Wellbeing MVP · tap any screen to interact</small>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
/* Wellbeing — MVP front-end logic. Zero dependencies. */
(function () {
  "use strict";

  const STORAGE_KEY = "wellbeing.mvp.v2";

  const todayActivities = [
    { id: "walk", time: "8:00 AM", label: "Morning walk", type: "t-walk", icon: iconWalk },
    { id: "lunch", time: "12:30 PM", label: "Lunch time", type: "t-lunch", icon: iconLunch },
    { id: "pushup", time: "2:30 PM", label: "Push-ups", type: "t-pushup", icon: iconPushup },
    { id: "temp", time: "4:00 PM", label: "Elevated body temperature", type: "t-temp", icon: iconTemp },
  ];

  const suggestions = [
    {
      id: "mindful",
      title: "Mindful moment",
      desc: "Take a breath, slow down",
      ill: illMindful,
    },
    {
      id: "community",
      title: "Community insight",
      desc: "See how others are feeling",
      ill: illCommunity,
    },
    {
      id: "report",
      title: "Download report",
      desc: "Get weekly health summary",
      ill: illReport,
    },
  ];

  const feelingScale = [
    { atOrAbove: 80, title: "Hungry", sub: "Time for a snack" },
    { atOrAbove: 55, title: "Comfortable", sub: "Feeling balanced" },
    { atOrAbove: 30, title: "Satisfied", sub: "Feel comfortable" },
    { atOrAbove: 0, title: "Very full", sub: "Maybe take a walk" },
  ];

  const state = load() || {
    activeTab: "home",
    range: "weekly",
    feeling: 40,
    completedActivities: {},
    history: [],
  };

  /* ─── Render ─── */

  function renderActivities() {
    const root = document.getElementById("activities");
    root.innerHTML = "";
    todayActivities.forEach((a) => {
      const el = document.createElement("button");
      el.className = `act ${a.type}`;
      el.setAttribute("aria-pressed", state.completedActivities[a.id] ? "true" : "false");
      el.innerHTML = `
        <div class="icon">${a.icon()}</div>
        <div class="time">${a.time}</div>
        <div class="label">${a.label}</div>
      `;
      el.addEventListener("click", () => {
        state.completedActivities[a.id] = !state.completedActivities[a.id];
        save();
        toast(
          state.completedActivities[a.id]
            ? `Logged: ${a.label}`
            : `Removed: ${a.label}`
        );
        el.setAttribute("aria-pressed", state.completedActivities[a.id] ? "true" : "false");
        el.style.outline = state.completedActivities[a.id]
          ? "2px solid rgba(139,92,246,0.6)"
          : "none";
      });
      if (state.completedActivities[a.id]) {
        el.style.outline = "2px solid rgba(139,92,246,0.6)";
      }
      root.appendChild(el);
    });
  }

  function renderSuggestions() {
    const root = document.getElementById("suggestions");
    root.innerHTML = "";
    suggestions.forEach((s) => {
      const el = document.createElement("button");
      el.className = "sug";
      el.innerHTML = `
        <div class="ill">${s.ill()}</div>
        <div class="title">${s.title}</div>
        <div class="desc">${s.desc}</div>
      `;
      el.addEventListener("click", () => handleSuggestion(s.id));
      root.appendChild(el);
    });
  }

  function handleSuggestion(id) {
    if (id === "mindful") {
      toast("Inhale… 4s · hold 4s · exhale 4s");
    } else if (id === "community") {
      toast("63% of users feel satisfied today");
    } else if (id === "report") {
      const blob = buildReport();
      const url = URL.createObjectURL(
        new Blob([blob], { type: "text/plain;charset=utf-8" })
      );
      const a = document.createElement("a");
      a.href = url;
      a.download = `wellbeing-report-${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Report downloaded");
    }
  }

  function buildReport() {
    const completed = todayActivities
      .filter((a) => state.completedActivities[a.id])
      .map((a) => `  • ${a.time} — ${a.label}`)
      .join("\n");
    const fl = feelingFor(state.feeling);
    return [
      "Wellbeing — Daily Health Report",
      "─".repeat(34),
      `Date: ${new Date().toLocaleDateString()}`,
      `Current feeling: ${fl.title} (${state.feeling}/100)`,
      `Note: ${fl.sub}`,
      "",
      "Activities completed:",
      completed || "  (none)",
      "",
      `Range: ${state.range}`,
      `History entries: ${state.history.length}`,
    ].join("\n");
  }

  function feelingFor(v) {
    return feelingScale.find((s) => v >= s.atOrAbove) || feelingScale[feelingScale.length - 1];
  }

  /* ─── Splash → home ─── */
  document.getElementById("enterApp").addEventListener("click", () => {
    document
      .querySelector('[data-screen="home"]')
      .scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    toast("Welcome back, Jhon");
  });

  /* ─── See all ─── */
  document.getElementById("seeAll").addEventListener("click", () => {
    toast("Activity history coming soon");
  });

  /* ─── Bottom tabs ─── */
  document.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.activeTab = btn.dataset.tab;
      save();
      if (btn.dataset.tab === "report") {
        document
          .querySelector('[data-screen="report"]')
          .scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      } else if (btn.dataset.tab === "home") {
        document
          .querySelector('[data-screen="home"]')
          .scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      } else if (btn.dataset.tab === "history") {
        toast("History — last " + state.history.length + " check-ins");
      } else if (btn.dataset.tab === "checkin") {
        toast("Daily check-in saved");
        state.history.push({ at: Date.now(), feeling: state.feeling });
        save();
      }
    });
  });

  /* ─── Segmented control ─── */
  document.querySelectorAll(".seg").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".seg").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      state.range = btn.dataset.range;
      save();
      toast(`Showing ${state.range} report`);
    });
    if (btn.dataset.range === state.range) {
      document.querySelectorAll(".seg").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
    }
  });

  /* ─── Slider ─── */
  const slider = document.getElementById("feelSlider");
  const fill = document.getElementById("sliderFill");
  const titleEl = document.getElementById("statusTitle");
  const subEl = document.getElementById("statusSub");

  function applySlider(val) {
    fill.style.height = `${val}%`;
    const f = feelingFor(val);
    titleEl.textContent = f.title;
    subEl.textContent = f.sub;
  }
  slider.value = state.feeling;
  applySlider(state.feeling);
  slider.addEventListener("input", (e) => {
    state.feeling = Number(e.target.value);
    applySlider(state.feeling);
  });
  slider.addEventListener("change", () => save());

  /* ─── Next button ─── */
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.history.push({ at: Date.now(), feeling: state.feeling });
    save();
    const f = feelingFor(state.feeling);
    toast(`Saved — feeling ${f.title.toLowerCase()}`);
  });

  /* ─── Boot ─── */
  renderActivities();
  renderSuggestions();

  /* ─── Helpers ─── */
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {}
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (_) {
      return null;
    }
  }
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  /* ─── Inline SVG icons (kept here so HTML stays clean) ─── */
  function iconWalk() {
    return `<svg viewBox="0 0 24 24"><path d="M14 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 22l3-9 4 2 1 5h2l-2-7-3-2 1-5-3 1-2 4 2 1-3 10z" fill="currentColor"/></svg>`;
  }
  function iconLunch() {
    return `<svg viewBox="0 0 24 24"><path d="M3 11c0-3 4-5 9-5s9 2 9 5H3zm0 2h18c0 4-4 7-9 7s-9-3-9-7zM6 4c0 1 1 1 1 2s-1 1-1 2M10 4c0 1 1 1 1 2s-1 1-1 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  function iconPushup() {
    return `<svg viewBox="0 0 24 24"><path d="M2 18h20M5 14c1-2 3-3 6-3s5 1 6 3M14 9a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  }
  function iconTemp() {
    return `<svg viewBox="0 0 24 24"><path d="M12 14V4a2 2 0 1 1 4 0v10a4 4 0 1 1-4 0z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="17" r="2" fill="currentColor"/></svg>`;
  }
  function illMindful() {
    return `<svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="5" fill="#a78bfa"/><path d="M10 40c2-8 8-12 14-12s12 4 14 12" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/><path d="M14 32c-3 0-5 2-5 4M34 32c3 0 5 2 5 4" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round"/></svg>`;
  }
  function illCommunity() {
    return `<svg viewBox="0 0 48 48"><circle cx="16" cy="16" r="4" fill="#f472b6"/><circle cx="32" cy="16" r="4" fill="#a78bfa"/><circle cx="24" cy="26" r="5" fill="#67e8f9"/><path d="M6 38c2-5 6-7 10-7M42 38c-2-5-6-7-10-7M14 40c2-4 6-6 10-6s8 2 10 6" fill="none" stroke="#7a6cad" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
  function illReport() {
    return `<svg viewBox="0 0 48 48"><rect x="8" y="34" width="6" height="8" rx="1" fill="#a78bfa"/><rect x="20" y="24" width="6" height="18" rx="1" fill="#c084fc"/><rect x="32" y="14" width="6" height="28" rx="1" fill="#f472b6"/><path d="M8 12l10 8 8-6 14-10" fill="none" stroke="#7a6cad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 4h6v6" fill="none" stroke="#7a6cad" stroke-width="2" stroke-linecap="round"/></svg>`;
  }
})();

</script>
  </body>
</html>
